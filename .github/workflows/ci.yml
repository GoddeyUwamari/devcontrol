name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy backend and migration tooling to production"
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Minimum free space (MiB) every production deploy's SSM command requires
  # on each filesystem it writes to, checked by
  # .github/scripts/deploy-disk-preflight.sh before anything is downloaded,
  # extracted or deleted. Derived from measured sizes (2026-10-10, fresh
  # `npm ci --workspace=backend --include-workspace-root=false --omit=dev`
  # with an empty npm cache): backend node_modules 338 MiB + npm cache
  # growth 35 MiB + dist tarball 0.6 MiB + staged dist 2.9 MiB (briefly
  # alongside the live dist) = ~377 MiB peak; the migration artifacts are
  # each under 2 MiB extracted. 1024 MiB is ~2.7x the backend peak: room
  # for dependency growth and Linux/macOS platform differences in the
  # measurement, and it keeps the root volume (which also holds the
  # database and logs) from being driven to 0 by a deploy. The migration
  # jobs use the same floor because they run concurrently with
  # deploy-backend on the same filesystem.
  DEPLOY_MIN_FREE_MIB: '1024'

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history (not the default depth-1 shallow clone) -- required
          # by validate-release-compatibility-declaration.js below, which
          # verifies a declared migration's post-baseline claim against real
          # git history (git rev-parse / git ls-tree against an arbitrary
          # historical ref). No other job's checkout needs this and none
          # were changed.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate release-compatibility declaration
        run: node .github/scripts/validate-release-compatibility-declaration.js

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || true

      # Frontend unit tests (vitest + jsdom): no database, network or secrets.
      - name: Run frontend tests
        run: npm run test:frontend

      - name: Create devcontrol role for CI schema bootstrap
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d platform_portal -c "CREATE ROLE devcontrol;"

      - name: Bootstrap CI test schema
        run: node .github/scripts/ci-bootstrap-schema.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: platform_portal
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Generate backend version module
        run: node backend/scripts/generate-version.js

      - name: Run backend tests
        run: npm test --workspace=backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: platform_portal
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-jwt-secret-not-a-real-secret-32c
          ENCRYPTION_KEY: ci-test-encryption-key-32-chars.

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.getdevcontrol.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
          retention-days: 7

  deploy-backend:
    runs-on: ubuntu-24.04
    needs: lint-and-build
    # One production run of this job at a time, across workflow runs (two
    # quick pushes to main, or a re-run while an earlier attempt's SSM
    # command is still on the host). Never cancels a job that has started.
    # One group PER JOB, not a shared one: GitHub keeps at most one pending
    # job per group and cancels any older pending one, so a single group
    # spanning these three jobs of the same run would cancel one of them.
    concurrency:
      group: production-deploy-backend
      cancel-in-progress: false
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy == 'true'
        )
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Build backend
        run: cd backend && npm run build

      - name: Copy static assets to dist
        run: cp -r backend/src/templates backend/dist/

      - name: Package dist
        run: tar czf dist.tar.gz -C backend/dist .

      - name: Prepare package manifests for deploy
        run: |
          cp backend/package.json package.json.deploy
          cp package.json workspace-package.json.deploy
          cp package-lock.json package-lock.json.deploy

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get last known-good deploy (for rollback)
        id: get_prev_sha
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Read last known-good deploy marker" \
            --parameters '{"commands":["sudo -H -u ubuntu --preserve-env=PATH bash -c \"cat /home/ubuntu/devcontrol/backend/.deployed_sha 2>/dev/null || echo NONE\""]}' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true

          PREV_SHA=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "StandardOutputContent" --output text | tr -d '[:space:]')

          echo "Last known-good deploy marker: '$PREV_SHA'"

          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" == "NONE" ]; then
            echo "No previous known-good deploy recorded — treating as first deploy."
            echo "prev_sha=" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if aws s3api head-object --bucket devcontrol-deploy-artifacts --key "backend/$PREV_SHA/dist.tar.gz" >/dev/null 2>&1; then
            echo "Previous artifact backend/$PREV_SHA/dist.tar.gz confirmed present in S3."
            echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Marker points to $PREV_SHA but no matching artifact exists in S3 (backend/$PREV_SHA/dist.tar.gz) — rollback will be skipped if needed."
            echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Workspace root manifest + lockfile artifacts only exist for SHAs
          # deployed after the workspace-aware npm ci install was introduced.
          # Rollback needs to know this so it can fall back to the legacy
          # backend-only `npm install` for an older marked-good SHA that
          # predates these artifacts, instead of failing outright.
          if aws s3api head-object --bucket devcontrol-deploy-artifacts --key "backend/$PREV_SHA/workspace-package.json" >/dev/null 2>&1 && \
             aws s3api head-object --bucket devcontrol-deploy-artifacts --key "backend/$PREV_SHA/package-lock.json" >/dev/null 2>&1; then
            echo "Workspace root manifest + lockfile present for $PREV_SHA — rollback will use npm ci workspace install."
            echo "prev_workspace_artifacts_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workspace root manifest + lockfile not found for $PREV_SHA (predates workspace-aware install) — rollback will fall back to legacy backend-only npm install."
            echo "prev_workspace_artifacts_exist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist to S3
        run: aws s3 cp dist.tar.gz s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/dist.tar.gz

      - name: Upload package manifest to S3
        run: aws s3 cp package.json.deploy s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/package.json

      - name: Upload workspace root manifest and lockfile to S3
        run: |
          aws s3 cp workspace-package.json.deploy s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/workspace-package.json
          aws s3 cp package-lock.json.deploy s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/package-lock.json

      - name: Deploy via SSM and restart PM2
        id: deploy
        run: |
          set -eo pipefail
          # Built with jq (not manual JSON string concatenation) because the
          # install step below needs a nested `bash -c "..."` invocation --
          # jq's --arg substitution and native JSON serialization keep that
          # quoting correct instead of relying on hand-written escapes.
          #
          # Ordering (run 38037952336 deleted the live dist/ and
          # node_modules/ and only then hit a full disk in `npm ci`):
          #   1. disk preflight (.github/scripts/deploy-disk-preflight.sh,
          #      shipped base64 like the migration jobs' symlink script) on
          #      every filesystem written to — /tmp and the install root;
          #   2. download + extract dist and download all three manifests
          #      into a staging dir on the same filesystem as the install;
          #   3. only then touch the live release: swap dist in, install
          #      the manifests, reinstall node_modules, restart PM2.
          # Any failure in 1-2 prints DEPLOY_ABORTED_BEFORE_LIVE_CHANGES
          # (from the EXIT trap, never otherwise) so rollback can be skipped
          # for a release that was never modified. The trap also removes the
          # deploy's own tarball and staging dir on success and failure; it
          # never touches dist/, node_modules/ or anything else persistent.
          #
          # The preflight script travels base64-encoded with its SHA-256. The
          # host decodes it to a temp file and verifies the hash before
          # running it, so a corrupt or truncated payload stops the deploy
          # (with the untouched marker) instead of silently running an empty
          # or partial preflight.
          #
          # Timeouts: --timeout-seconds 120 (delivery) means a command the
          # agent hasn't started within 120s never starts; executionTimeout
          # 480s stops a hung one. Together they bound the command's life to
          # about the poller's 600s ceiling. That's only defense in depth:
          # the poller can also give up early (non-retryable API error,
          # registration deadline), so "Stop the deploy command before
          # rollback" below cancels the command and confirms a terminal
          # status before any rollback is sent, and skips rollback if it
          # can't.
          #
          # Anything that fails before send-command returns a command ID
          # (encoding, jq, send-command itself) has sent nothing to the
          # host, so the EXIT trap marks the live release untouched and
          # rollback is skipped.
          SENT=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$SENT" = 0 ]; then echo "live_release_untouched=true" >> "$GITHUB_OUTPUT"; echo "::error::Deploy ${{ github.sha }} failed before an SSM command ID was received (payload encoding, jq or send-command failed), so no deploy command is known to have been sent. If send-command failed after SSM accepted the request (e.g. a lost response), a command with comment \"Deploy devcontrol-api ${{ github.sha }}\" could still exist; check SSM command history."; fi' EXIT
          PREFLIGHT_SCRIPT_B64=$(base64 < .github/scripts/deploy-disk-preflight.sh | tr -d '\n')
          PREFLIGHT_SCRIPT_SHA256=$(sha256sum < .github/scripts/deploy-disk-preflight.sh | cut -d' ' -f1)
          if [ -z "$PREFLIGHT_SCRIPT_B64" ] || [ "${#PREFLIGHT_SCRIPT_SHA256}" -ne 64 ]; then
            echo "::error::Could not encode .github/scripts/deploy-disk-preflight.sh for the SSM payload — refusing to deploy."
            exit 1
          fi
          PARAMS=$(jq -n \
            --arg sha "${{ github.sha }}" \
            --arg preflight_b64 "$PREFLIGHT_SCRIPT_B64" \
            --arg preflight_sha256 "$PREFLIGHT_SCRIPT_SHA256" \
            --arg min_free "$DEPLOY_MIN_FREE_MIB" \
            '("/home/ubuntu/devcontrol/.deploy-staging-" + $sha) as $stage
            | ("/tmp/dist-" + $sha + ".tar.gz") as $tarball
            | {"commands": [
              "set -e",
              "export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin",
              "LIVE_RELEASE_TOUCHED=0",
              "PREFLIGHT_SH=",
              ("trap '\''rc=$?; rm -f " + $tarball + "; rm -rf " + $stage + "; [ -z \"$PREFLIGHT_SH\" ] || rm -f \"$PREFLIGHT_SH\"; if [ $rc -ne 0 ] && [ $LIVE_RELEASE_TOUCHED = 0 ]; then echo DEPLOY_ABORTED_BEFORE_LIVE_CHANGES; fi'\'' EXIT"),
              "PREFLIGHT_SH=$(mktemp)",
              ("echo " + $preflight_b64 + " | base64 -d > \"$PREFLIGHT_SH\""),
              ("if ! { [ -s \"$PREFLIGHT_SH\" ] && echo \"" + $preflight_sha256 + "  $PREFLIGHT_SH\" | sha256sum -c --status; }; then echo \"ERROR: deploy-disk-preflight.sh payload failed to decode or verify — refusing to deploy.\" >&2; exit 1; fi"),
              ("bash \"$PREFLIGHT_SH\" " + $min_free + " /tmp /home/ubuntu/devcontrol"),
              ("sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/dist.tar.gz " + $tarball),
              ("sudo -H -u ubuntu --preserve-env=PATH rm -rf " + $stage),
              ("sudo -H -u ubuntu --preserve-env=PATH mkdir -p " + $stage + "/dist " + $stage + "/manifests"),
              ("sudo -H -u ubuntu --preserve-env=PATH tar xzf " + $tarball + " -C " + $stage + "/dist"),
              ("sudo -H -u ubuntu --preserve-env=PATH rm -f " + $tarball),
              ("sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/package.json " + $stage + "/manifests/backend-package.json"),
              ("sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/workspace-package.json " + $stage + "/manifests/workspace-package.json"),
              ("sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/package-lock.json " + $stage + "/manifests/package-lock.json"),
              "LIVE_RELEASE_TOUCHED=1",
              "echo Staged release verified, now modifying the live release",
              "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/dist",
              ("sudo -H -u ubuntu --preserve-env=PATH mv " + $stage + "/dist /home/ubuntu/devcontrol/backend/dist"),
              ("sudo -H -u ubuntu --preserve-env=PATH mv " + $stage + "/manifests/backend-package.json /home/ubuntu/devcontrol/backend/package.json"),
              ("sudo -H -u ubuntu --preserve-env=PATH mv " + $stage + "/manifests/workspace-package.json /home/ubuntu/devcontrol/package.json"),
              ("sudo -H -u ubuntu --preserve-env=PATH mv " + $stage + "/manifests/package-lock.json /home/ubuntu/devcontrol/package-lock.json"),
              "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/node_modules",
              "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/node_modules",
              "sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol && npm ci --workspace=backend --include-workspace-root=false --omit=dev --legacy-peer-deps\"",
              "sudo -H -u ubuntu --preserve-env=PATH pm2 restart devcontrol-api --update-env",
              "sudo -H -u ubuntu --preserve-env=PATH pm2 save",
              "echo ✅ Backend deployed, awaiting smoke test"
            ], "executionTimeout": ["480"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devcontrol-api ${{ github.sha }}" \
            --timeout-seconds 120 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "::error::send-command returned no command ID."
            exit 1
          fi
          SENT=1
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

          # A real deploy runs `npm ci` on the host and can legitimately take
          # several minutes — `aws ssm wait command-executed`'s short default
          # ceiling (~100s) treats that as a failure while the command is
          # still genuinely InProgress. Poll for a real terminal status
          # instead; see the script for the timeout rationale and the
          # incidents (runs 33836015818 and 38037952336) it fixes.
          SSM_LOG="$RUNNER_TEMP/deploy-ssm-output.log"
          if bash .github/scripts/wait-for-ssm-command.sh "$COMMAND_ID" "i-0c3e55c290844ec59" 2>&1 | tee "$SSM_LOG"; then
            exit 0
          fi
          # Only a positive marker from the remote EXIT trap proves the live
          # release was never modified. Missing/unretrievable output (e.g.
          # the invocation never registered, or the agent killed the command)
          # is treated as "possibly modified", so rollback still runs.
          if grep -q 'DEPLOY_ABORTED_BEFORE_LIVE_CHANGES' "$SSM_LOG"; then
            echo "live_release_untouched=true" >> "$GITHUB_OUTPUT"
            echo "::error::Deploy ${{ github.sha }} aborted before modifying the live release (e.g. disk preflight, payload verification or artifact download failed) — the previous release is still running; rollback is not needed."
          fi
          exit 1

      - name: Smoke test new deploy
        id: smoke_test
        continue-on-error: true
        run: |
          set +e
          MAX_ATTEMPTS=5
          ATTEMPT=1
          LAST_ERROR=""

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Smoke test attempt $ATTEMPT/$MAX_ATTEMPTS..."
            RESPONSE=$(curl -sS -f --max-time 10 https://api.getdevcontrol.com/health)
            CURL_EXIT=$?

            if [ $CURL_EXIT -ne 0 ]; then
              LAST_ERROR="health check request failed or timed out (curl exit $CURL_EXIT)"
            else
              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"' 2>/dev/null)
              JQ_EXIT=$?
              if [ $JQ_EXIT -ne 0 ] || [ -z "$STATUS" ]; then
                LAST_ERROR="health endpoint returned unparseable response: $RESPONSE"
              elif [ "$STATUS" != "ok" ]; then
                LAST_ERROR="health endpoint returned status=\"$STATUS\""
              else
                echo "Smoke test passed on attempt $ATTEMPT — health endpoint reports status=ok"
                exit 0
              fi
            fi

            echo "Attempt $ATTEMPT failed: $LAST_ERROR"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Smoke test failed after $MAX_ATTEMPTS attempts — $LAST_ERROR"
          exit 1

      - name: Record successful deploy
        if: steps.smoke_test.outcome == 'success'
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Record healthy deploy ${{ github.sha }}" \
            --parameters '{"commands":["sudo -H -u ubuntu --preserve-env=PATH bash -c \"echo ${{ github.sha }} > /home/ubuntu/devcontrol/backend/.deployed_sha\""]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true
          echo "✅ Deploy ${{ github.sha }} verified healthy and recorded as last known-good"

      # Runs when the smoke test fails OR when the deploy step itself fails
      # or times out (run 38037952336: the deploy step failed after the
      # host had already deleted the live release, and rollback — then
      # gated on the smoke test alone — was skipped, extending the outage).
      # `!cancelled()` is required: without a status function, `if:`
      # implicitly ANDs success(), which is false once the deploy step has
      # failed. The one deploy failure that skips rollback is the one that
      # positively proved, via the remote EXIT trap's marker (or by never
      # sending a command), that the live release was never modified —
      # rolling back a healthy release on a disk that just failed preflight
      # would itself risk an outage.
      #
      # This step carries the rollback decision; "Roll back to previous
      # deploy" runs only if it confirms the deploy command is no longer
      # running on the host. The deploy and the rollback both delete and
      # reinstall node_modules/ in the same directory, so they must never
      # overlap. The poller can give up while the deploy is still running
      # or queued: a non-retryable API error, the registration deadline, or
      # a command still Pending/Delayed. So unless the deploy command is
      # already terminal, this step cancels it and waits for a terminal
      # status. If that can't be confirmed (cancel-command fails, e.g.
      # ssm:CancelCommand not granted, or no terminal status within 180s),
      # rollback is skipped and the job fails loudly.
      - name: Stop the deploy command before rollback
        id: settle_deploy
        if: >
          !cancelled() &&
          (
            steps.smoke_test.outcome == 'failure' ||
            (
              steps.deploy.outcome == 'failure' &&
              steps.deploy.outputs.live_release_untouched != 'true'
            )
          ) &&
          steps.get_prev_sha.outputs.prev_artifact_exists == 'true' &&
          steps.get_prev_sha.outputs.prev_sha != github.sha
        env:
          DEPLOY_COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: i-0c3e55c290844ec59
        run: |
          set -eo pipefail
          if [ -z "$DEPLOY_COMMAND_ID" ]; then
            echo "::error::No deploy command ID was recorded, so it can't be confirmed that no deploy command is running on $INSTANCE_ID — rollback SKIPPED. Check SSM command history and production /health now."
            exit 1
          fi
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$DEPLOY_COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text 2>/dev/null) || STATUS="unknown (lookup failed)"
          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut)
              echo "Deploy command $DEPLOY_COMMAND_ID on $INSTANCE_ID already finished ($STATUS) — safe to roll back."
              echo "settled=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "Deploy command $DEPLOY_COMMAND_ID on $INSTANCE_ID is not finished (status: $STATUS) — cancelling it before rollback."
          if ! aws ssm cancel-command --command-id "$DEPLOY_COMMAND_ID" --instance-ids "$INSTANCE_ID"; then
            echo "::error::cancel-command failed for deploy command $DEPLOY_COMMAND_ID on instance $INSTANCE_ID (is ssm:CancelCommand granted to the deploy role?). The deploy may still be running, so rollback is SKIPPED to avoid two installs racing on the host. Check the command in SSM and production /health now."
            exit 1
          fi
          if SSM_WAIT_ANY_TERMINAL_OK=1 SSM_WAIT_MAX_SECONDS=180 bash .github/scripts/wait-for-ssm-command.sh "$DEPLOY_COMMAND_ID" "$INSTANCE_ID"; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Deploy command $DEPLOY_COMMAND_ID on instance $INSTANCE_ID did not reach a terminal status within 180s of cancel-command. It may still be running, so rollback is SKIPPED to avoid two installs racing on the host. Check the command in SSM and production /health now."
          exit 1

      - name: Roll back to previous deploy
        id: rollback
        if: "!cancelled() && steps.settle_deploy.outputs.settled == 'true'"
        run: |
          set -e
          echo "Deploy step outcome: ${{ steps.deploy.outcome }}, smoke test outcome: ${{ steps.smoke_test.outcome }} — rolling back to previous known-good deploy: ${{ steps.get_prev_sha.outputs.prev_sha }}"

          # Which install command to use is decided here (build time), not
          # inside the remote script, so the SSM payload never needs a
          # runtime if/else — it just ships the install steps for whichever
          # path applies to this specific prev_sha.
          PARAMS=$(jq -n \
            --arg sha "${{ steps.get_prev_sha.outputs.prev_sha }}" \
            --arg ws "${{ steps.get_prev_sha.outputs.prev_workspace_artifacts_exist }}" \
            '(if $ws == "true" then
                [
                  ("sudo -H -u ubuntu --preserve-env=PATH bash -c \"aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/workspace-package.json /home/ubuntu/devcontrol/package.json && aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/package-lock.json /home/ubuntu/devcontrol/package-lock.json\""),
                  "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/node_modules",
                  "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/node_modules",
                  "sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol && npm ci --workspace=backend --include-workspace-root=false --omit=dev --legacy-peer-deps\""
                ]
              else
                [
                  "sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/node_modules",
                  "sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol/backend && npm install --legacy-peer-deps --production\""
                ]
              end) as $install_steps
            | {"commands": (
                ["set -e", "export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin",
                 "trap '\''rm -f /tmp/dist-rollback.tar.gz'\'' EXIT"]
                + [("sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/dist.tar.gz /tmp/dist-rollback.tar.gz")]
                + ["sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/dist",
                   "sudo -H -u ubuntu --preserve-env=PATH mkdir -p /home/ubuntu/devcontrol/backend/dist",
                   "sudo -H -u ubuntu --preserve-env=PATH tar xzf /tmp/dist-rollback.tar.gz -C /home/ubuntu/devcontrol/backend/dist",
                   "sudo -H -u ubuntu --preserve-env=PATH rm -f /tmp/dist-rollback.tar.gz"]
                + [("sudo -H -u ubuntu --preserve-env=PATH bash -c \"aws s3 cp s3://devcontrol-deploy-artifacts/backend/" + $sha + "/package.json /home/ubuntu/devcontrol/backend/package.json || echo '\''No package.json artifact for this SHA, keeping existing file'\''\"")]
                + $install_steps
                + ["sudo -H -u ubuntu --preserve-env=PATH pm2 restart devcontrol-api --update-env",
                   "sudo -H -u ubuntu --preserve-env=PATH pm2 save",
                   ("echo Rolled back to " + $sha)]
              ), "executionTimeout": ["480"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback devcontrol-api to ${{ steps.get_prev_sha.outputs.prev_sha }}" \
            --timeout-seconds 120 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "Rollback SSM command ID: $COMMAND_ID"

          # Same rationale as the deploy step above: rollback also runs an
          # `npm install`/`npm ci` on the host and can take several minutes,
          # so it needs the same bounded-polling fix rather than the
          # short-ceiling `aws ssm wait command-executed`, and the same
          # delivery timeout and executionTimeout. No disk preflight
          # here: rollback only runs once the live release may already be
          # broken, so refusing to try would never leave production better.
          bash .github/scripts/wait-for-ssm-command.sh "$COMMAND_ID" "i-0c3e55c290844ec59"

      - name: Verify rollback health
        id: rollback_smoke_test
        if: "!cancelled() && steps.rollback.outcome == 'success'"
        continue-on-error: true
        run: |
          set +e
          MAX_ATTEMPTS=5
          ATTEMPT=1
          LAST_ERROR=""

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Rollback smoke test attempt $ATTEMPT/$MAX_ATTEMPTS..."
            RESPONSE=$(curl -sS -f --max-time 10 https://api.getdevcontrol.com/health)
            CURL_EXIT=$?

            if [ $CURL_EXIT -ne 0 ]; then
              LAST_ERROR="health check request failed or timed out (curl exit $CURL_EXIT)"
            else
              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"' 2>/dev/null)
              JQ_EXIT=$?
              if [ $JQ_EXIT -ne 0 ] || [ -z "$STATUS" ]; then
                LAST_ERROR="health endpoint returned unparseable response: $RESPONSE"
              elif [ "$STATUS" != "ok" ]; then
                LAST_ERROR="health endpoint returned status=\"$STATUS\""
              else
                echo "Rollback verified healthy on attempt $ATTEMPT"
                exit 0
              fi
            fi

            echo "Attempt $ATTEMPT failed: $LAST_ERROR"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Rollback smoke test failed after $MAX_ATTEMPTS attempts — $LAST_ERROR"
          exit 1

      - name: Fail job on broken deploy
        if: >
          !cancelled() &&
          (steps.deploy.outcome == 'failure' || steps.smoke_test.outcome == 'failure')
        run: |
          if [ "${{ steps.deploy.outcome }}" == "failure" ]; then
            echo "::error::Deploy ${{ github.sha }} FAILED in the SSM deploy step (failed, timed out, or never confirmed)."
          else
            echo "::error::Deploy ${{ github.sha }} FAILED its post-deploy smoke test."
          fi
          if [ "${{ steps.deploy.outputs.live_release_untouched }}" == "true" ]; then
            echo "::error::The deploy aborted before modifying the live release (see the deploy step log: disk preflight, payload verification, artifact download, or no SSM command sent), so rollback was intentionally skipped — the previous release should still be serving. Confirm /health and fix the cause before redeploying."
          elif [ "${{ steps.settle_deploy.outcome }}" == "failure" ]; then
            echo "::error::Rollback was SKIPPED: deploy command '${{ steps.deploy.outputs.command_id }}' on instance i-0c3e55c290844ec59 could not be confirmed stopped (see \"Stop the deploy command before rollback\"). Production may be mid-install. Investigate immediately."
          elif [ "${{ steps.rollback.outcome }}" == "success" ] && [ "${{ steps.rollback_smoke_test.outcome }}" == "success" ]; then
            echo "::error::Automatic rollback to previous deploy (${{ steps.get_prev_sha.outputs.prev_sha }}) succeeded — production is stable again, but ${{ github.sha }} must be fixed before redeploying."
          elif [ "${{ steps.rollback.outcome }}" == "success" ]; then
            echo "::error::Rollback ran but the restored version ALSO failed its smoke test — production may still be down. Investigate immediately."
          elif [ "${{ steps.get_prev_sha.outputs.prev_artifact_exists }}" != "true" ]; then
            echo "::error::No usable previous known-good deploy artifact was found (marker: '${{ steps.get_prev_sha.outputs.prev_sha }}'), so automatic rollback was skipped — production may be down. Investigate immediately."
          elif [ "${{ steps.get_prev_sha.outputs.prev_sha }}" == "${{ github.sha }}" ]; then
            echo "::error::Rollback was skipped: the last known-good marker already points at ${{ github.sha }} (this same commit was previously verified healthy), so there is no earlier release to roll back to. Production may be down. Investigate immediately."
          else
            echo "::error::Automatic rollback did not run or failed to execute — production may still be running the broken deploy. Investigate immediately."
          fi
          exit 1

  # Deploys the canonical migration tooling (database/migrate.js,
  # database/migrations/) as its own artifact, independent of the backend
  # deploy job above. This job ONLY makes files available on the production
  # host — it never invokes `node database/migrate.js` in any mode (not even
  # --dry-run), never touches schema_migrations or migration_tracking_baseline,
  # and never runs migration SQL. Production baseline initialization and
  # actual migration execution remain separate, manually-approved operations
  # performed later, by a human running the deployed tooling explicitly.
  #
  # Deliberately independent from deploy-backend (same `needs`, no
  # dependency on each other): a migration-tooling deploy failure must never
  # block or roll back the backend deploy, and vice versa — these are
  # unrelated concerns that happen to share a Git SHA.
  deploy-migration-tooling:
    runs-on: ubuntu-24.04
    needs: lint-and-build
    # One production run of this job at a time, across workflow runs (two
    # quick pushes to main, or a re-run while an earlier attempt's SSM
    # command is still on the host). Never cancels a job that has started.
    # One group PER JOB, not a shared one: GitHub keeps at most one pending
    # job per group and cancels any older pending one, so a single group
    # spanning these three jobs of the same run would cancel one of them.
    concurrency:
      group: production-deploy-migration-tooling
      cancel-in-progress: false
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy == 'true'
        )
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate source migration directory before packaging
        run: |
          set -e
          test -f database/migrate.js || { echo "::error::database/migrate.js is missing — refusing to package"; exit 1; }
          test -d database/migrations || { echo "::error::database/migrations/ is missing — refusing to package"; exit 1; }
          if ! find database/migrations -maxdepth 1 -name '*.sql' | grep -q .; then
            echo "::error::database/migrations/ contains no .sql files — refusing to package"
            exit 1
          fi
          echo "✅ database/migrate.js and database/migrations/*.sql present in source tree"

      - name: Package migration artifact (database/migrate.js + database/migrations/ only)
        run: tar czf migrations.tar.gz --exclude='./seeds' --exclude='./seeds/*' --exclude='./migrations-admin' --exclude='./migrations-admin/*' -C database .

      - name: Validate packaged artifact contents
        run: |
          set -e
          LISTING=$(tar tzf migrations.tar.gz)
          echo "$LISTING" | grep -qE '^\./migrate\.js$' || { echo "::error::packaged artifact is missing migrate.js at its root"; exit 1; }
          echo "$LISTING" | grep -qE '^\./migrations/.*\.sql$' || { echo "::error::packaged artifact is missing migrations/*.sql"; exit 1; }
          if echo "$LISTING" | grep -q 'backend/migrations'; then
            echo "::error::packaged artifact must not contain backend/migrations/ — the forensic audit established database/migrations/ as the sole canonical directory"
            exit 1
          fi
          if echo "$LISTING" | grep -qE '(^|/)seeds(/|$)'; then
            echo "::error::packaged artifact must not contain seeds/ — only migrate.js and migrations/ are canonical deployment artifacts"
            exit 1
          fi
          UNEXPECTED=$(echo "$LISTING" | grep -vE '^\./$|^\./migrate\.js$|^\./migrations/?$|^\./migrations/.*$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::packaged artifact contains unexpected entries outside the allowed shape (./migrate.js, ./migrations/**):"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "✅ packaged artifact validated: migrate.js + migrations/*.sql present, seeds/ and backend/migrations/ absent, no unexpected entries"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload migration artifact to S3
        run: aws s3 cp migrations.tar.gz s3://devcontrol-deploy-artifacts/database/${{ github.sha }}/migrations.tar.gz

      - name: Deploy migration tooling via SSM (files only — never executes migrations)
        id: deploy_migration_tooling
        run: |
          set -eo pipefail
          # The destination-symlink decision tree (Case A/B/B2/C/D/E) lives in
          # .github/scripts/deploy-migration-symlink.sh, not inline here. It is
          # base64-encoded and shipped as an opaque token — no `$`, quotes, or
          # other shell metacharacters from that script ever appear in this
          # JSON/YAML text, so nothing here can re-expand its variables early.
          # The remote host decodes and runs the exact file this repo tests.
          #
          # Disk preflight (.github/scripts/deploy-disk-preflight.sh, shipped
          # the same base64 way) runs before the download; the EXIT trap
          # removes this deploy's own tarball and decoded payloads on
          # success and failure. Both payloads are decoded to temp files and
          # verified against their SHA-256 before anything is downloaded,
          # so a corrupt payload stops the deploy instead of silently
          # running an empty script. --timeout-seconds 120 means a command
          # the agent hasn't started within 120s never starts late. The
          # release directory is only ever removed after a failed extract
          # into a directory THIS run created — a re-run for the same SHA
          # must never delete an existing (possibly live) release.
          # An existing same-SHA release dir is extracted over in place:
          # the artifact for one SHA has identical contents, so this only
          # rewrites files with the same bytes.
          SYMLINK_SCRIPT_B64=$(base64 < .github/scripts/deploy-migration-symlink.sh | tr -d '\n')
          SYMLINK_SCRIPT_SHA256=$(sha256sum < .github/scripts/deploy-migration-symlink.sh | cut -d' ' -f1)
          PREFLIGHT_SCRIPT_B64=$(base64 < .github/scripts/deploy-disk-preflight.sh | tr -d '\n')
          PREFLIGHT_SCRIPT_SHA256=$(sha256sum < .github/scripts/deploy-disk-preflight.sh | cut -d' ' -f1)
          if [ -z "$SYMLINK_SCRIPT_B64" ] || [ "${#SYMLINK_SCRIPT_SHA256}" -ne 64 ]; then
            echo "::error::Could not encode .github/scripts/deploy-migration-symlink.sh for the SSM payload — refusing to deploy."
            exit 1
          fi
          if [ -z "$PREFLIGHT_SCRIPT_B64" ] || [ "${#PREFLIGHT_SCRIPT_SHA256}" -ne 64 ]; then
            echo "::error::Could not encode .github/scripts/deploy-disk-preflight.sh for the SSM payload — refusing to deploy."
            exit 1
          fi
          PARAMS=$(jq -n \
            --arg sha "${{ github.sha }}" \
            --arg script_b64 "$SYMLINK_SCRIPT_B64" \
            --arg script_sha256 "$SYMLINK_SCRIPT_SHA256" \
            --arg preflight_b64 "$PREFLIGHT_SCRIPT_B64" \
            --arg preflight_sha256 "$PREFLIGHT_SCRIPT_SHA256" \
            --arg min_free "$DEPLOY_MIN_FREE_MIB" \
            '{"commands": [
              "set -e",
              "export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin",
              ("export RELEASE_DIR=/home/ubuntu/devcontrol/database-releases/" + $sha),
              "PREFLIGHT_SH=",
              "SYMLINK_SH=",
              ("trap '\''rm -f /tmp/migrations-" + $sha + ".tar.gz; [ -z \"$PREFLIGHT_SH\" ] || rm -f \"$PREFLIGHT_SH\"; [ -z \"$SYMLINK_SH\" ] || rm -f \"$SYMLINK_SH\"'\'' EXIT"),
              "PREFLIGHT_SH=$(mktemp)",
              ("echo " + $preflight_b64 + " | base64 -d > \"$PREFLIGHT_SH\""),
              ("if ! { [ -s \"$PREFLIGHT_SH\" ] && echo \"" + $preflight_sha256 + "  $PREFLIGHT_SH\" | sha256sum -c --status; }; then echo \"ERROR: deploy-disk-preflight.sh payload failed to decode or verify — refusing to deploy.\" >&2; exit 1; fi"),
              "SYMLINK_SH=$(mktemp)",
              ("echo " + $script_b64 + " | base64 -d > \"$SYMLINK_SH\""),
              ("if ! { [ -s \"$SYMLINK_SH\" ] && echo \"" + $script_sha256 + "  $SYMLINK_SH\" | sha256sum -c --status; }; then echo \"ERROR: deploy-migration-symlink.sh payload failed to decode or verify — refusing to deploy.\" >&2; exit 1; fi"),
              ("bash \"$PREFLIGHT_SH\" " + $min_free + " /tmp /home/ubuntu/devcontrol/database-releases"),
              ("sudo -H -u ubuntu --preserve-env=PATH,RELEASE_DIR aws s3 cp s3://devcontrol-deploy-artifacts/database/" + $sha + "/migrations.tar.gz /tmp/migrations-" + $sha + ".tar.gz"),
              ("sudo -H -u ubuntu --preserve-env=PATH,RELEASE_DIR bash -c \"if [ -e $RELEASE_DIR ]; then tar xzf /tmp/migrations-" + $sha + ".tar.gz -C $RELEASE_DIR; else mkdir -p $RELEASE_DIR && tar xzf /tmp/migrations-" + $sha + ".tar.gz -C $RELEASE_DIR || (rm -rf $RELEASE_DIR; exit 1); fi\""),
              ("sudo -H -u ubuntu --preserve-env=PATH rm -f /tmp/migrations-" + $sha + ".tar.gz"),
              ("sudo -H -u ubuntu --preserve-env=PATH,RELEASE_DIR bash -c \"echo " + $sha + " > $RELEASE_DIR/.deployed_sha\""),
              "sudo -H -u ubuntu --preserve-env=PATH,RELEASE_DIR bash -s -- \"$RELEASE_DIR\" /home/ubuntu/devcontrol/database < \"$SYMLINK_SH\"",
              "echo \"✅ Migration tooling deployed (files only — never executes migrations). The symlink step above logged its own Case A/B result, or this whole step already failed if it exited non-zero.\"",
              "echo \"Operator commands (run manually via an authenticated session — never automatically):\"",
              "echo \"  cd /home/ubuntu/devcontrol && NODE_PATH=/home/ubuntu/devcontrol/backend/node_modules node database/migrate.js --dry-run\"",
              "echo \"  cd /home/ubuntu/devcontrol && NODE_PATH=/home/ubuntu/devcontrol/backend/node_modules node database/migrate.js --pending\""
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy migration tooling ${{ github.sha }} (files only, no execution)" \
            --timeout-seconds 120 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          # Same bounded poller as deploy-backend (registration-delay retry,
          # explicit terminal statuses, diagnostics on failure) instead of
          # `aws ssm wait command-executed || true`.
          bash .github/scripts/wait-for-ssm-command.sh "$COMMAND_ID" "i-0c3e55c290844ec59" || {
            echo "::error::Migration tooling deploy did not succeed (see SSM diagnostics above)"
            exit 1
          }

  # Deploys the ADMINISTRATIVE migration tooling (database/migrate.js +
  # database/migrations-admin/) as its own artifact, entirely independent
  # from both deploy-backend and deploy-migration-tooling above. See
  # database/migrations-admin/README.md for the full rationale: some
  # migrations (e.g. ENABLE ROW LEVEL SECURITY on a postgres-owned table)
  # require ownership-level DDL the application's `devcontrol` role can
  # never perform, no matter how this job or migrate.js itself are
  # configured -- devcontrol is deliberately non-owner on every application
  # table. This job exists to stage those migrations somewhere PostgreSQL
  # role `postgres` can actually reach and execute, via the pre-existing
  # `local all postgres peer` Unix-socket authentication rule already
  # present in production's pg_hba.conf -- never a new password, never a
  # change to devcontrol's own credentials or grants.
  #
  # Like deploy-migration-tooling, this job ONLY makes files available on
  # the host. It never executes `node database/migrate.js` in any mode, and
  # never touches schema_migrations or migration_tracking_baseline. Running
  # an administrative migration remains a separate, manually-approved
  # operation, requiring its own explicit authorization beyond what merging
  # to main or this deploy provides.
  #
  # Deliberately does NOT deploy under /home/ubuntu -- OS user `postgres`
  # cannot traverse into that directory (confirmed live), and widening its
  # permissions was explicitly rejected as a solution. /opt/devcontrol-admin
  # is a location created for this purpose alone, group-owned by `postgres`
  # with no "other" access, so only OS users `root` and `postgres` can read
  # it -- never `ubuntu`, and never world-readable. The packaged artifact
  # ships its own self-contained node_modules/ (just `pg` and its
  # dependencies, installed during this job, not on the host) so nothing
  # deployed here ever needs to read from /home/ubuntu either.
  deploy-migration-tooling-admin:
    runs-on: ubuntu-24.04
    needs: lint-and-build
    # One production run of this job at a time, across workflow runs (two
    # quick pushes to main, or a re-run while an earlier attempt's SSM
    # command is still on the host). Never cancels a job that has started.
    # One group PER JOB, not a shared one: GitHub keeps at most one pending
    # job per group and cancels any older pending one, so a single group
    # spanning these three jobs of the same run would cancel one of them.
    concurrency:
      group: production-deploy-migration-tooling-admin
      cancel-in-progress: false
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.deploy == 'true'
        )
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate source admin migration directory before packaging
        run: |
          set -e
          test -f database/migrate.js || { echo "::error::database/migrate.js is missing — refusing to package"; exit 1; }
          test -d database/migrations-admin || { echo "::error::database/migrations-admin/ is missing — refusing to package"; exit 1; }
          if ! find database/migrations-admin -maxdepth 1 -name '*.sql' | grep -q .; then
            echo "::error::database/migrations-admin/ contains no .sql files — refusing to package"
            exit 1
          fi
          echo "✅ database/migrate.js and database/migrations-admin/*.sql present in source tree"

      - name: Package self-contained admin migration artifact (migrate.js + migrations-admin/*.sql, staged as migrations/, + a fresh node_modules/pg)
        run: |
          set -e
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/migrations"
          cp database/migrate.js "$STAGE/migrate.js"
          cp database/migrations-admin/*.sql "$STAGE/migrations/"
          npm install pg --no-save --no-audit --no-fund --prefix "$STAGE"
          # npm installs into $STAGE/node_modules with an npm-managed $STAGE/package.json
          # and $STAGE/package-lock.json alongside it — neither is needed by migrate.js
          # (which requires('pg') by name, resolved via node_modules/ regardless of any
          # package.json existing beside it) and both are excluded from the shipped
          # artifact, same principle as excluding seeds/ from the ordinary package.
          rm -f "$STAGE/package.json" "$STAGE/package-lock.json"
          tar czf migrations-admin.tar.gz -C "$STAGE" .

      - name: Validate packaged admin artifact contents
        run: |
          set -e
          LISTING=$(tar tzf migrations-admin.tar.gz)
          echo "$LISTING" | grep -qE '^\./migrate\.js$' || { echo "::error::packaged admin artifact is missing migrate.js at its root"; exit 1; }
          echo "$LISTING" | grep -qE '^\./migrations/.*\.sql$' || { echo "::error::packaged admin artifact is missing migrations/*.sql"; exit 1; }
          echo "$LISTING" | grep -qE '^\./node_modules/pg/' || { echo "::error::packaged admin artifact is missing its self-contained node_modules/pg"; exit 1; }
          echo "✅ packaged admin artifact validated: migrate.js + migrations/*.sql + node_modules/pg present"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload admin migration artifact to S3
        run: aws s3 cp migrations-admin.tar.gz s3://devcontrol-deploy-artifacts/database-admin/${{ github.sha }}/migrations-admin.tar.gz

      - name: Deploy admin migration tooling via SSM (files only — never executes migrations)
        id: deploy_migration_tooling_admin
        run: |
          set -eo pipefail
          # Disk preflight, verified payload decoding, delivery timeout,
          # cleanup trap and "never remove a release directory this run
          # didn't create" (same-SHA in-place extract) exactly as in
          # deploy-migration-tooling above.
          SYMLINK_SCRIPT_B64=$(base64 < .github/scripts/deploy-migration-symlink.sh | tr -d '\n')
          SYMLINK_SCRIPT_SHA256=$(sha256sum < .github/scripts/deploy-migration-symlink.sh | cut -d' ' -f1)
          PREFLIGHT_SCRIPT_B64=$(base64 < .github/scripts/deploy-disk-preflight.sh | tr -d '\n')
          PREFLIGHT_SCRIPT_SHA256=$(sha256sum < .github/scripts/deploy-disk-preflight.sh | cut -d' ' -f1)
          if [ -z "$SYMLINK_SCRIPT_B64" ] || [ "${#SYMLINK_SCRIPT_SHA256}" -ne 64 ]; then
            echo "::error::Could not encode .github/scripts/deploy-migration-symlink.sh for the SSM payload — refusing to deploy."
            exit 1
          fi
          if [ -z "$PREFLIGHT_SCRIPT_B64" ] || [ "${#PREFLIGHT_SCRIPT_SHA256}" -ne 64 ]; then
            echo "::error::Could not encode .github/scripts/deploy-disk-preflight.sh for the SSM payload — refusing to deploy."
            exit 1
          fi
          PARAMS=$(jq -n \
            --arg sha "${{ github.sha }}" \
            --arg script_b64 "$SYMLINK_SCRIPT_B64" \
            --arg script_sha256 "$SYMLINK_SCRIPT_SHA256" \
            --arg preflight_b64 "$PREFLIGHT_SCRIPT_B64" \
            --arg preflight_sha256 "$PREFLIGHT_SCRIPT_SHA256" \
            --arg min_free "$DEPLOY_MIN_FREE_MIB" \
            '{"commands": [
              "set -e",
              "export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin",
              ("export RELEASE_DIR=/opt/devcontrol-admin/database-releases/" + $sha),
              "PREFLIGHT_SH=",
              "SYMLINK_SH=",
              ("trap '\''rm -f /tmp/migrations-admin-" + $sha + ".tar.gz; [ -z \"$PREFLIGHT_SH\" ] || rm -f \"$PREFLIGHT_SH\"; [ -z \"$SYMLINK_SH\" ] || rm -f \"$SYMLINK_SH\"'\'' EXIT"),
              "PREFLIGHT_SH=$(mktemp)",
              ("echo " + $preflight_b64 + " | base64 -d > \"$PREFLIGHT_SH\""),
              ("if ! { [ -s \"$PREFLIGHT_SH\" ] && echo \"" + $preflight_sha256 + "  $PREFLIGHT_SH\" | sha256sum -c --status; }; then echo \"ERROR: deploy-disk-preflight.sh payload failed to decode or verify — refusing to deploy.\" >&2; exit 1; fi"),
              "SYMLINK_SH=$(mktemp)",
              ("echo " + $script_b64 + " | base64 -d > \"$SYMLINK_SH\""),
              ("if ! { [ -s \"$SYMLINK_SH\" ] && echo \"" + $script_sha256 + "  $SYMLINK_SH\" | sha256sum -c --status; }; then echo \"ERROR: deploy-migration-symlink.sh payload failed to decode or verify — refusing to deploy.\" >&2; exit 1; fi"),
              ("bash \"$PREFLIGHT_SH\" " + $min_free + " /tmp /opt/devcontrol-admin/database-releases"),
              "mkdir -p /opt/devcontrol-admin/database-releases",
              ("aws s3 cp s3://devcontrol-deploy-artifacts/database-admin/" + $sha + "/migrations-admin.tar.gz /tmp/migrations-admin-" + $sha + ".tar.gz"),
              ("bash -c \"if [ -e $RELEASE_DIR ]; then tar xzf /tmp/migrations-admin-" + $sha + ".tar.gz -C $RELEASE_DIR; else mkdir -p $RELEASE_DIR && tar xzf /tmp/migrations-admin-" + $sha + ".tar.gz -C $RELEASE_DIR || (rm -rf $RELEASE_DIR; exit 1); fi\""),
              ("rm -f /tmp/migrations-admin-" + $sha + ".tar.gz"),
              ("bash -c \"echo " + $sha + " > $RELEASE_DIR/.deployed_sha\""),
              ("chgrp -R postgres $RELEASE_DIR"),
              ("chmod -R o-rwx,g+rX $RELEASE_DIR"),
              "bash -s -- \"$RELEASE_DIR\" /opt/devcontrol-admin/database < \"$SYMLINK_SH\"",
              "echo \"✅ Administrative migration tooling deployed (files only — never executes migrations). Readable by OS users root and postgres only.\"",
              "echo \"Running an administrative migration remains a separate, explicitly-authorized, manual operation — see database/migrations-admin/README.md.\""
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy admin migration tooling ${{ github.sha }} (files only, no execution)" \
            --timeout-seconds 120 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          # Same bounded poller as deploy-backend (registration-delay retry,
          # explicit terminal statuses, diagnostics on failure) instead of
          # `aws ssm wait command-executed || true`.
          bash .github/scripts/wait-for-ssm-command.sh "$COMMAND_ID" "i-0c3e55c290844ec59" || {
            echo "::error::Admin migration tooling deploy did not succeed (see SSM diagnostics above)"
            exit 1
          }