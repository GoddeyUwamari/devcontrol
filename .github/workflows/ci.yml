name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || true

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.getdevcontrol.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
          retention-days: 7

  deploy-backend:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Build backend
        run: cd backend && npm run build

      - name: Copy static assets to dist
        run: cp -r backend/src/templates backend/dist/

      - name: Package dist
        run: tar czf dist.tar.gz -C backend/dist .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload dist to S3
        run: aws s3 cp dist.tar.gz s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/dist.tar.gz

      - name: Deploy via SSM and restart PM2
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devcontrol-api ${{ github.sha }}" \
            --parameters '{"commands":["set -e","export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin","sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/dist.tar.gz /tmp/dist-${{ github.sha }}.tar.gz","sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH mkdir -p /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH tar xzf /tmp/dist-${{ github.sha }}.tar.gz -C /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH rm -f /tmp/dist-${{ github.sha }}.tar.gz","sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol/backend && npm install --legacy-peer-deps --production\"","sudo -H -u ubuntu --preserve-env=PATH pm2 restart devcontrol-api --update-env","sudo -H -u ubuntu --preserve-env=PATH pm2 save","echo ✅ Backend deployed successfully"]}' \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "Status" --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
              --query "StandardErrorContent" --output text
            echo "SSM deploy command finished with status: $STATUS"
            exit 1
          fi