name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || true

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.getdevcontrol.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
          retention-days: 7

  deploy-backend:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Build backend
        run: cd backend && npm run build

      - name: Copy static assets to dist
        run: cp -r backend/src/templates backend/dist/

      - name: Package dist
        run: tar czf dist.tar.gz -C backend/dist .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get last known-good deploy (for rollback)
        id: get_prev_sha
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Read last known-good deploy marker" \
            --parameters '{"commands":["sudo -H -u ubuntu --preserve-env=PATH bash -c \"cat /home/ubuntu/devcontrol/backend/.deployed_sha 2>/dev/null || echo NONE\""]}' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true

          PREV_SHA=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "StandardOutputContent" --output text | tr -d '[:space:]')

          echo "Last known-good deploy marker: '$PREV_SHA'"

          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" == "NONE" ]; then
            echo "No previous known-good deploy recorded — treating as first deploy."
            echo "prev_sha=" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if aws s3api head-object --bucket devcontrol-deploy-artifacts --key "backend/$PREV_SHA/dist.tar.gz" >/dev/null 2>&1; then
            echo "Previous artifact backend/$PREV_SHA/dist.tar.gz confirmed present in S3."
            echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Marker points to $PREV_SHA but no matching artifact exists in S3 (backend/$PREV_SHA/dist.tar.gz) — rollback will be skipped if needed."
            echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "prev_artifact_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist to S3
        run: aws s3 cp dist.tar.gz s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/dist.tar.gz

      - name: Deploy via SSM and restart PM2
        id: deploy
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devcontrol-api ${{ github.sha }}" \
            --parameters '{"commands":["set -e","export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin","sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/${{ github.sha }}/dist.tar.gz /tmp/dist-${{ github.sha }}.tar.gz","sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH mkdir -p /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH tar xzf /tmp/dist-${{ github.sha }}.tar.gz -C /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH rm -f /tmp/dist-${{ github.sha }}.tar.gz","sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/node_modules","sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol/backend && npm install --legacy-peer-deps --production\"","sudo -H -u ubuntu --preserve-env=PATH pm2 restart devcontrol-api --update-env","sudo -H -u ubuntu --preserve-env=PATH pm2 save","echo ✅ Backend deployed, awaiting smoke test"]}' \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "Status" --output text)

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
              --query "StandardErrorContent" --output text
            echo "SSM deploy command finished with status: $STATUS"
            exit 1
          fi

      - name: Smoke test new deploy
        id: smoke_test
        continue-on-error: true
        run: |
          set +e
          MAX_ATTEMPTS=5
          ATTEMPT=1
          LAST_ERROR=""

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Smoke test attempt $ATTEMPT/$MAX_ATTEMPTS..."
            RESPONSE=$(curl -sS -f --max-time 10 https://api.getdevcontrol.com/health)
            CURL_EXIT=$?

            if [ $CURL_EXIT -ne 0 ]; then
              LAST_ERROR="health check request failed or timed out (curl exit $CURL_EXIT)"
            else
              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"' 2>/dev/null)
              JQ_EXIT=$?
              if [ $JQ_EXIT -ne 0 ] || [ -z "$STATUS" ]; then
                LAST_ERROR="health endpoint returned unparseable response: $RESPONSE"
              elif [ "$STATUS" != "ok" ]; then
                LAST_ERROR="health endpoint returned status=\"$STATUS\""
              else
                echo "Smoke test passed on attempt $ATTEMPT — health endpoint reports status=ok"
                exit 0
              fi
            fi

            echo "Attempt $ATTEMPT failed: $LAST_ERROR"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Smoke test failed after $MAX_ATTEMPTS attempts — $LAST_ERROR"
          exit 1

      - name: Record successful deploy
        if: steps.smoke_test.outcome == 'success'
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Record healthy deploy ${{ github.sha }}" \
            --parameters '{"commands":["sudo -H -u ubuntu --preserve-env=PATH bash -c \"echo ${{ github.sha }} > /home/ubuntu/devcontrol/backend/.deployed_sha\""]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true
          echo "✅ Deploy ${{ github.sha }} verified healthy and recorded as last known-good"

      - name: Roll back to previous deploy
        id: rollback
        if: >
          steps.smoke_test.outcome == 'failure' &&
          steps.get_prev_sha.outputs.prev_artifact_exists == 'true' &&
          steps.get_prev_sha.outputs.prev_sha != github.sha
        run: |
          set -e
          echo "Smoke test failed — rolling back to previous known-good deploy: ${{ steps.get_prev_sha.outputs.prev_sha }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3e55c290844ec59" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback devcontrol-api to ${{ steps.get_prev_sha.outputs.prev_sha }}" \
            --parameters '{"commands":["set -e","export PATH=$PATH:/snap/bin:/usr/local/bin:/usr/bin","sudo -H -u ubuntu --preserve-env=PATH aws s3 cp s3://devcontrol-deploy-artifacts/backend/${{ steps.get_prev_sha.outputs.prev_sha }}/dist.tar.gz /tmp/dist-rollback.tar.gz","sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH mkdir -p /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH tar xzf /tmp/dist-rollback.tar.gz -C /home/ubuntu/devcontrol/backend/dist","sudo -H -u ubuntu --preserve-env=PATH rm -f /tmp/dist-rollback.tar.gz","sudo -H -u ubuntu --preserve-env=PATH rm -rf /home/ubuntu/devcontrol/backend/node_modules","sudo -H -u ubuntu --preserve-env=PATH bash -c \"cd /home/ubuntu/devcontrol/backend && npm install --legacy-peer-deps --production\"","sudo -H -u ubuntu --preserve-env=PATH pm2 restart devcontrol-api --update-env","sudo -H -u ubuntu --preserve-env=PATH pm2 save","echo Rolled back to ${{ steps.get_prev_sha.outputs.prev_sha }}"]}' \
            --query "Command.CommandId" --output text)
          echo "Rollback SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "Status" --output text)

          echo "--- rollback stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- rollback stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "i-0c3e55c290844ec59" \
              --query "StandardErrorContent" --output text
            echo "Rollback SSM command finished with status: $STATUS"
            exit 1
          fi

      - name: Verify rollback health
        id: rollback_smoke_test
        if: steps.rollback.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          MAX_ATTEMPTS=5
          ATTEMPT=1
          LAST_ERROR=""

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Rollback smoke test attempt $ATTEMPT/$MAX_ATTEMPTS..."
            RESPONSE=$(curl -sS -f --max-time 10 https://api.getdevcontrol.com/health)
            CURL_EXIT=$?

            if [ $CURL_EXIT -ne 0 ]; then
              LAST_ERROR="health check request failed or timed out (curl exit $CURL_EXIT)"
            else
              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"' 2>/dev/null)
              JQ_EXIT=$?
              if [ $JQ_EXIT -ne 0 ] || [ -z "$STATUS" ]; then
                LAST_ERROR="health endpoint returned unparseable response: $RESPONSE"
              elif [ "$STATUS" != "ok" ]; then
                LAST_ERROR="health endpoint returned status=\"$STATUS\""
              else
                echo "Rollback verified healthy on attempt $ATTEMPT"
                exit 0
              fi
            fi

            echo "Attempt $ATTEMPT failed: $LAST_ERROR"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Rollback smoke test failed after $MAX_ATTEMPTS attempts — $LAST_ERROR"
          exit 1

      - name: Fail job on broken deploy
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "::error::Deploy ${{ github.sha }} FAILED its post-deploy smoke test."
          if [ "${{ steps.rollback.outcome }}" == "success" ] && [ "${{ steps.rollback_smoke_test.outcome }}" == "success" ]; then
            echo "::error::Automatic rollback to previous deploy (${{ steps.get_prev_sha.outputs.prev_sha }}) succeeded — production is stable again, but ${{ github.sha }} must be fixed before redeploying."
          elif [ "${{ steps.rollback.outcome }}" == "success" ]; then
            echo "::error::Rollback ran but the restored version ALSO failed its smoke test — production may still be down. Investigate immediately."
          elif [ "${{ steps.get_prev_sha.outputs.prev_artifact_exists }}" != "true" ]; then
            echo "::error::No usable previous known-good deploy artifact was found (marker: '${{ steps.get_prev_sha.outputs.prev_sha }}'), so automatic rollback was skipped — production may be down. Investigate immediately."
          else
            echo "::error::Automatic rollback did not run or failed to execute — production may still be running the broken deploy. Investigate immediately."
          fi
          exit 1